<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Админ-панель | MetalPro</title>
    <style>
        :root {
            --dark: #1A1D23;
            --dark-2: #23272F;
            --dark-3: #2D323C;
            --accent: #F97316;
            --accent-hover: #EA580C;
            --white: #FFFFFF;
            --light: #F5F6F7;
            --border: #E5E7EB;
            --border-dark: #343A44;
            --text: #1F2937;
            --text-light: #6B7280;
            --text-muted: #9CA3AF;
            --danger: #DC2626;
            --radius: 2px;
            --transition: 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== СТРАНИЦА ЛОГИНА ===== */
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px;
            text-align: left;
        }

        .login-card__logo {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dark);
            color: white;
            border-radius: var(--radius);
            margin-bottom: 20px;
            font-size: 22px;
        }

        .login-card h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-card p {
            color: var(--text-light);
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 44px 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            transition: border-color var(--transition);
            font-family: inherit;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-muted);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background var(--transition);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        .btn-login:hover {
            background: var(--accent-hover);
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .blocked-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        .blocked-msg.show {
            display: block;
        }

        /* ===== АДМИН-ПАНЕЛЬ ===== */
        .admin-app {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: var(--light);
        }

        .admin-app.active {
            display: block;
        }

        .admin-header {
            background: var(--dark);
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header h1 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-header__actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        .btn-back { background: transparent; color: white; border-color: rgba(255,255,255,0.2); }
        .btn-back:hover { background: rgba(255,255,255,0.08); border-color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #B91C1C; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-logout { background: transparent; color: white; border-color: rgba(255,255,255,0.2); }
        .btn-logout:hover { background: rgba(255,255,255,0.08); border-color: white; }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            text-align: left;
        }

        .stat-card__number {
            font-size: 32px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -1px;
        }

        .stat-card__label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filters-bar {
            background: white;
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters-bar select,
        .filters-bar input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            min-width: 170px;
            font-family: inherit;
            color: var(--text);
            background: white;
        }

        .filters-bar select:focus,
        .filters-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .table-wrapper {
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .table-header h2 {
            font-size: 15px;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .lead-count {
            background: var(--dark);
            color: white;
            padding: 4px 12px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 700;
        }

        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--light); }

        th {
            padding: 14px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        tr:hover { background: var(--light); }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-callback { background: #DBEAFE; color: #1E40AF; }
        .badge-order { background: #D1FAE5; color: #065F46; }
        .badge-quick { background: #FEF3C7; color: #92400E; }
        .badge-new { background: var(--accent); color: white; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state__icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }

        /* Модалка */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition);
        }

        .modal.active { opacity: 1; visibility: visible; }

        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 32px;
            max-width: 520px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px; right: 12px;
            width: 32px; height: 32px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-size: 16px;
            color: var(--text);
            transition: all var(--transition);
        }

        .modal-close:hover {
            background: var(--dark);
            color: white;
            border-color: var(--dark);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            gap: 16px;
        }

        .detail-label {
            font-weight: 600;
            color: var(--text-light);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .table-wrapper { overflow-x: auto; }
            table { min-width: 700px; }
            .filters-bar { flex-direction: column; align-items: stretch; }
            .filters-bar select,
            .filters-bar input { width: 100%; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .admin-header { padding: 14px 16px; flex-wrap: wrap; gap: 10px; }
            .admin-container { padding: 20px 16px; }
        }
    </style>
</head>
<body>
<!-- ===== ЛОГИН ===== -->
<div class="login-container" id="loginPage">
    <div class="login-card">
        <div class="login-card__logo">MP</div>
        <h1>Админ-панель</h1>
        <p>MetalPro — управление заявками</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" placeholder="admin" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="togglePass()">Показать</button>
                </div>
            </div>
            <div class="error-msg" id="loginError">Неверный логин или пароль</div>
            <div class="blocked-msg" id="blockedMsg">Доступ заблокирован. Попробуйте позже.</div>
            <button type="submit" class="btn-login" id="loginBtn">Войти</button>
        </form>
    </div>
</div>

<!-- ===== АДМИН-ПАНЕЛЬ ===== -->
<div class="admin-app" id="adminApp">
    <header class="admin-header">
        <h1>Админ-панель MetalPro</h1>
        <div class="admin-header__actions">
            <a href="index.html" class="btn btn-back">На сайт</a>
            <button class="btn btn-danger" onclick="clearAllLeads()">Очистить всё</button>
            <button class="btn btn-logout" onclick="logout()">Выйти</button>
        </div>
    </header>

    <div class="admin-container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card__number" id="totalLeads">0</div>
                <div class="stat-card__label">Всего заявок</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__number" id="todayLeads">0</div>
                <div class="stat-card__label">Сегодня</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__number" id="weekLeads">0</div>
                <div class="stat-card__label">За неделю</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__number" id="monthLeads">0</div>
                <div class="stat-card__label">За месяц</div>
            </div>
        </div>

        <div class="filters-bar">
            <select id="filterType" onchange="renderTable()">
                <option value="all">Все типы</option>
                <option value="callback">Обратный звонок</option>
                <option value="order">Заказ</option>
                <option value="quick_calc">Быстрый расчёт</option>
                <option value="contact">Контакт</option>
            </select>
            <select id="filterStatus" onchange="renderTable()">
                <option value="all">Все статусы</option>
                <option value="new">Новые</option>
                <option value="processed">Обработанные</option>
            </select>
            <input type="date" id="filterDate" onchange="renderTable()">
            <input type="text" id="filterSearch" oninput="renderTable()" placeholder="Поиск...">
            <button class="btn btn-primary" onclick="exportCSV()">Экспорт CSV</button>
        </div>

        <div class="table-wrapper">
            <div class="table-header">
                <h2>Заявки</h2>
                <span class="lead-count" id="filteredCount">0</span>
            </div>
            <div id="tableContainer">
                <table>
                    <thead>
                    <tr>
                        <th>Дата</th><th>Тип</th><th>Имя</th><th>Телефон</th>
                        <th>Продукт</th><th>Статус</th><th>Действия</th>
                    </tr>
                    </thead>
                    <tbody id="leadsTableBody"></tbody>
                </table>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <div class="empty-state__icon">—</div>
                    <p>Заявок пока нет</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модалка -->
<div class="modal" id="detailModal">
    <div class="modal-content" id="detailContent"></div>
</div>

<script>
    var API_URL = 'https://arkon-stroy.ru/api';

    // ===== ЛОГИН =====
    document.addEventListener('DOMContentLoaded', function() {
        var loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value;

                try {
                    var res = await fetch(API_URL + '/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    var data = await res.json();

                    if (data.success) {
                        sessionStorage.setItem('metalpro_token', data.token);
                        showAdminPanel();
                        init();
                    } else {
                        document.getElementById('loginError').classList.add('show');
                        setTimeout(function() { document.getElementById('loginError').classList.remove('show'); }, 2000);
                    }
                } catch (err) {
                    alert('Ошибка соединения с сервером');
                }
            });
        }

        // Проверка сессии
        var token = sessionStorage.getItem('metalpro_token');
        if (token) {
            showAdminPanel();
            init();
        }

        // Закрытие модалки
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetail();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDetail();
        });

        // Фильтры
        document.getElementById('filterType').addEventListener('change', renderTable);
        document.getElementById('filterStatus').addEventListener('change', renderTable);
        document.getElementById('filterDate').addEventListener('change', renderTable);
        document.getElementById('filterSearch').addEventListener('input', renderTable);
    });

    function showAdminPanel() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('adminApp').classList.add('active');
        document.body.style.display = 'block';
        document.body.style.alignItems = 'unset';
    }

    // ===== API =====
    async function getLeads() {
        var token = sessionStorage.getItem('metalpro_token');
        try {
            var res = await fetch(API_URL + '/leads', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            return await res.json();
        } catch (err) {
            return [];
        }
    }

    async function getStats() {
        var token = sessionStorage.getItem('metalpro_token');
        try {
            var res = await fetch(API_URL + '/leads/stats', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            return await res.json();
        } catch (err) {
            return { total: 0, today: 0, week: 0, month: 0, new: 0 };
        }
    }

    // ===== СТАТИСТИКА =====
    async function updateStats() {
        var stats = await getStats();
        document.getElementById('totalLeads').textContent = stats.total || 0;
        document.getElementById('todayLeads').textContent = stats.today || 0;
        document.getElementById('weekLeads').textContent = stats.week || 0;
        document.getElementById('monthLeads').textContent = stats.month || 0;
    }

    // ===== ТАБЛИЦА =====
    async function renderTable() {
        var allLeads = await getLeads();

        var filterType = document.getElementById('filterType').value;
        var filterStatus = document.getElementById('filterStatus').value;
        var filterDate = document.getElementById('filterDate').value;
        var filterSearch = document.getElementById('filterSearch').value.toLowerCase();

        var leads = allLeads.filter(function(l) {
            if (filterType !== 'all' && l.type !== filterType) return false;
            if (filterStatus !== 'all' && (l.status || 'new') !== filterStatus) return false;
            if (filterDate) {
                var leadDate = new Date(l.createDate || l.create_date).toDateString();
                var selectedDate = new Date(filterDate).toDateString();
                if (leadDate !== selectedDate) return false;
            }
            if (filterSearch) {
                var searchable = ((l.name || '') + ' ' + (l.phone || '') + ' ' + (l.company || '') + ' ' + (l.product || '')).toLowerCase();
                if (!searchable.includes(filterSearch)) return false;
            }
            return true;
        });

        document.getElementById('filteredCount').textContent = leads.length;

        var tbody = document.getElementById('leadsTableBody');
        var emptyState = document.getElementById('emptyState');

        if (leads.length === 0) {
            tbody.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }

        emptyState.style.display = 'none';

        tbody.innerHTML = leads.map(function(l) {
            var typeBadge = '';
            if (l.type === 'callback') typeBadge = '<span class="badge badge-callback">Звонок</span>';
            else if (l.type === 'order') typeBadge = '<span class="badge badge-order">Заказ</span>';
            else if (l.type === 'quick_calc') typeBadge = '<span class="badge badge-quick">Расчёт</span>';
            else if (l.type === 'contact') typeBadge = '<span class="badge badge-order">Контакт</span>';
            else typeBadge = '<span class="badge">' + l.type + '</span>';

            var statusBadge = l.status === 'processed'
                ? '<span style="color:#059669;font-weight:700;">Обработан</span>'
                : '<span class="badge badge-new">Новый</span>';

            return `
            <tr>
                <td>${new Date(l.createDate || l.create_date || Date.now()).toLocaleString('ru-RU')}</td>
                <td>${typeBadge}</td>
                <td>${l.name || '—'}</td>
                <td><a href="tel:${l.phone}">${l.phone || '—'}</a></td>
                <td>${l.product || l.productType || '—'}</td>
                <td>${statusBadge}</td>
                <td>
                    <button class="btn btn-primary" style="padding:6px 12px;font-size:11px;" onclick="showDetail(${l.id})">Открыть</button>
                    <button class="btn btn-danger" style="padding:6px 12px;font-size:11px;" onclick="deleteLead(${l.id})">Удалить</button>
                </td>
            </tr>
        `;
        }).join('');
    }

    // ===== ДЕТАЛИ =====
    function showDetail(id) {
        getLeads().then(function(leads) {
            var l = leads.find(function(x) {
                return String(x.id) === String(id);
            });

            if (!l) {
                alert('Заявка не найдена');
                return;
            }

            var content = document.getElementById('detailContent');
            content.innerHTML = `
            <button class="modal-close" onclick="closeDetail()">✕</button>
            <h3 style="margin-bottom:20px;text-transform:uppercase;letter-spacing:0.5px;">Заявка #${l.id}</h3>
            <div class="detail-row"><span class="detail-label">Дата</span><span>${new Date(l.createDate || l.create_date || Date.now()).toLocaleString('ru-RU')}</span></div>
            <div class="detail-row"><span class="detail-label">Тип</span><span>${l.type}</span></div>
            <div class="detail-row"><span class="detail-label">Имя</span><span>${l.name || '—'}</span></div>
            <div class="detail-row"><span class="detail-label">Телефон</span><span><a href="tel:${l.phone}">${l.phone || '—'}</a></span></div>
            <div class="detail-row"><span class="detail-label">Email</span><span>${l.email || '—'}</span></div>
            <div class="detail-row"><span class="detail-label">Компания</span><span>${l.company || '—'}</span></div>
            <div class="detail-row"><span class="detail-label">Продукт</span><span>${l.product || l.productType || '—'}</span></div>
            <div class="detail-row"><span class="detail-label">Площадь</span><span>${l.area ? l.area + ' м²' : '—'}</span></div>
            <div class="detail-row"><span class="detail-label">Сообщение</span><span>${l.message || l.comment || '—'}</span></div>
            <button class="btn btn-primary" style="width:100%;margin-top:20px;justify-content:center;" onclick="markProcessed(${l.id})">Отметить обработанной</button>
        `;

            document.getElementById('detailModal').classList.add('active');
        });
    }

    function closeDetail() {
        document.getElementById('detailModal').classList.remove('active');
    }

    // ===== ДЕЙСТВИЯ =====
    async function markProcessed(id) {
        var token = sessionStorage.getItem('metalpro_token');
        await fetch(API_URL + '/leads/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ status: 'processed' })
        });
        closeDetail();
        renderTable();
        updateStats();
    }

    async function deleteLead(id) {
        if (!confirm('Удалить заявку?')) return;
        var token = sessionStorage.getItem('metalpro_token');
        await fetch(API_URL + '/leads/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        renderTable();
        updateStats();
    }

    async function clearAllLeads() {
        if (!confirm('Удалить ВСЕ заявки?')) return;
        var token = sessionStorage.getItem('metalpro_token');
        await fetch(API_URL + '/leads', {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        renderTable();
        updateStats();
    }

    // ===== ЭКСПОРТ CSV =====
    async function exportCSV() {
        try {
            var leads = await getLeads();

            if (!leads || leads.length === 0) {
                alert('Нет заявок для экспорта');
                return;
            }

            var csv = 'ID;Дата;Тип;Имя;Телефон;Email;Компания;Продукт;Количество;Площадь;Сообщение;Статус\n';

            leads.forEach(function(l) {
                var row = [
                    l.id,
                    new Date(l.createDate || Date.now()).toLocaleString('ru-RU'),
                    l.type || '',
                    (l.name || '').replace(/;/g, ','),
                    (l.phone || '').replace(/;/g, ','),
                    (l.email || '').replace(/;/g, ','),
                    (l.company || '').replace(/;/g, ','),
                    (l.product || l.productType || '').replace(/;/g, ','),
                    l.quantity || '',
                    l.area || '',
                    (l.message || l.comment || '').replace(/;/g, ','),
                    l.status || 'new'
                ];

                csv += row.join(';') + '\n';
            });

            var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'leads_' + new Date().toISOString().slice(0, 10) + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (err) {
            alert('Ошибка экспорта: ' + err.message);
        }
    }

    // ===== ВЫХОД =====
    function logout() {
        sessionStorage.removeItem('metalpro_token');
        location.reload();
    }

    function togglePass() {
        var input = document.getElementById('password');
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    function init() {
        updateStats();
        renderTable();
        setInterval(function() {
            updateStats();
            renderTable();
        }, 30000);
    }
</script>
